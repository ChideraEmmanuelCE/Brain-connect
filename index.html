<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070812">
<title>Neon Dodge</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070812;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}.wrap{position:relative;width:min(100vw,520px);height:100dvh;max-height:920px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#18204a 0,#0b0e20 38%,#05060d 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0 0 auto 0;padding:18px 18px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.card{background:rgba(8,10,24,.62);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:16px;padding:9px 13px;box-shadow:0 8px 30px #0005}.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9da6c9}.value{font-size:20px;font-weight:800}.right{text-align:right}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:28px;background:rgba(3,4,12,.66);backdrop-filter:blur(9px);z-index:5}
.panel{width:min(410px,100%);text-align:center;padding:30px 24px;border:1px solid rgba(255,255,255,.12);border-radius:26px;background:linear-gradient(145deg,rgba(22,26,58,.92),rgba(7,9,20,.95));box-shadow:0 25px 80px #0009}
.logo{font-size:clamp(38px,11vw,58px);font-weight:950;letter-spacing:-.06em;line-height:1;margin:0 0 8px;text-shadow:0 0 30px #54eaff88}.logo span{color:#65f6bd}.sub{color:#aeb5d3;margin:0 0 22px;line-height:1.5}
button{border:0;color:#071018;background:#65f6bd;font:800 16px inherit;padding:14px 25px;border-radius:14px;cursor:pointer;box-shadow:0 10px 30px #65f6bd35;transition:.18s transform,.18s filter}button:active{transform:scale(.97)}button:hover{filter:brightness(1.08)}
.hint{margin-top:16px;color:#777f9f;font-size:12px}.hidden{display:none}
.controls{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;pointer-events:none;z-index:3}.ctrl{pointer-events:auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:#ffffff0b;border:1px solid #ffffff18;color:#fff;font-size:24px;user-select:none;-webkit-user-select:none;touch-action:none}.ctrl:active{background:#65f6bd22}
.pause{position:absolute;right:18px;top:86px;z-index:3;width:42px;height:42px;padding:0;border-radius:13px;background:#ffffff0b;color:#fff;border:1px solid #ffffff15;box-shadow:none;font-size:17px}.pause:hover{filter:none}
@media(min-width:700px){.wrap{height:min(100dvh,920px);border-radius:28px;box-shadow:0 30px 100px #0009}.controls{display:none}}
</style>
</head>
<body>
<main class="wrap">
<canvas id="game"></canvas>
<div class="hud"><div class="card"><div class="label">Score</div><div class="value" id="score">0</div></div><div class="card right"><div class="label">Best</div><div class="value" id="best">0</div></div></div>
<button class="pause" id="pause" aria-label="Pause">Ⅱ</button>
<div class="controls"><div class="ctrl" id="left">‹</div><div class="ctrl" id="right">›</div></div>
<section class="overlay" id="menu"><div class="panel"><h1 class="logo">NEON <span>DODGE</span></h1><p class="sub">Survive the falling hazards. Move fast, collect energy, and beat your high score.</p><button id="start">PLAY NOW</button><div class="hint">Keyboard: A/D or ←/→ &nbsp; • &nbsp; Mobile: touch controls</div></div></section>
<section class="overlay hidden" id="gameover"><div class="panel"><h2 class="logo" style="font-size:42px">GAME OVER</h2><p class="sub">You survived <b id="final">0</b> points.</p><button id="again">TRY AGAIN</button><div class="hint">Best score: <span id="best2">0</span></div></div></section>
</main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),wrap=document.querySelector('.wrap');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),best2=document.getElementById('best2');
let W,H,dpr,player,blocks=[],orbs=[],sparks=[],score=0,best=+localStorage.neonDodgeBest||0,running=false,paused=false,last=0,spawn=0,orbSpawn=0,keys={left:false,right:false};
bestEl.textContent=best;best2.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H-105,w:24,h:24,speed:360};blocks=[];orbs=[];sparks=[];score=0;spawn=0;orbSpawn=0;paused=false;scoreEl.textContent=0}
function start(){document.getElementById('menu').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');reset();running=true;last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.neonDodgeBest=best;bestEl.textContent=best;best2.textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('gameover').classList.remove('hidden')}
function particle(x,y,n=10){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*180;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.5})}}
function spawnBlock(){let size=18+Math.random()*30;blocks.push({x:Math.random()*(W-size),y:-size,w:size,h:size,v:145+score*.018+Math.random()*95,rot:Math.random()*6.28,vr:(Math.random()-.5)*3})}
function spawnOrb(){orbs.push({x:18+Math.random()*(W-36),y:-20,r:7,v:120+Math.random()*50})}
function hit(a,b){return a.x-a.w/2<b.x+b.w&&a.x+a.w/2>b.x&&a.y-a.h/2<b.y+b.h&&a.y+a.h/2>b.y}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;if(!paused)update(dt);draw();requestAnimationFrame(loop)}
function update(dt){score+=dt*10;scoreEl.textContent=Math.floor(score);let level=1+Math.floor(score/250);spawn-=dt;orbSpawn-=dt;if(spawn<=0){spawn=Math.max(.25,.78-level*.045);spawnBlock()}if(orbSpawn<=0){orbSpawn=1.2+Math.random();spawnOrb()}
if(keys.left)player.x-=player.speed*dt;if(keys.right)player.x+=player.speed*dt;player.x=Math.max(16,Math.min(W-16,player.x));
for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.y+=b.v*dt;b.rot+=b.vr*dt;if(b.y>H+60){blocks.splice(i,1);continue}if(hit(player,b)){particle(player.x,player.y,24);end();return}}
for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.y+=o.v*dt;if(o.y>H+20){orbs.splice(i,1);continue}if(Math.hypot(player.x-o.x,player.y-o.y)<20){score+=50;particle(o.x,o.y,14);orbs.splice(i,1)}}
for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101735');g.addColorStop(1,'#05060d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(110,130,255,.07)';ctx.lineWidth=1;let gap=44,off=(performance.now()/35)%gap;for(let x=0;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-gap+off;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const o of orbs){ctx.shadowBlur=20;ctx.shadowColor='#65f6bd';ctx.fillStyle='#65f6bd';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()}ctx.shadowBlur=0;
for(const b of blocks){ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(b.rot);ctx.shadowBlur=18;ctx.shadowColor='#ff4d88';ctx.fillStyle='#ff4d88';ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.shadowBlur=0;ctx.fillStyle='#ffb0cb';ctx.fillRect(-b.w*.2,-b.h*.2,b.w*.4,b.h*.4);ctx.restore()}
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=28;ctx.shadowColor='#58dfff';ctx.fillStyle='#58dfff';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(14,11);ctx.lineTo(0,6);ctx.lineTo(-14,11);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-3,3,0,7);ctx.fill();ctx.restore()}
for(const p of sparks){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
if(paused&&running){ctx.fillStyle='#0008';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 28px system-ui';ctx.fillText('PAUSED',W/2,H/2)}}
function togglePause(){if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('pause').onclick=togglePause;
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.key===' '){e.preventDefault();togglePause()}});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
function bind(id,side){let el=document.getElementById(id);const on=e=>{e.preventDefault();keys[side]=true};const off=e=>{e.preventDefault();keys[side]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}
bind('left','left');bind('right','right');
draw();
</script>
</body>
</html>
